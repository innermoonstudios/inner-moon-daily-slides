<div class="frame"></div>
<div id="content" class="center" style="top:200px">
  <img class="moon" src="{{moon}}" style="width:var(--moon-cta)">
  <div class="rule">{{star}}</div>
  <h1 class="headline" style="font-size:96px">{{headline}}</h1>
  <div class="sub" style="color:var(--gold);font-size:42px;margin-top:40px">{{sub}}</div>
  <div class="kicker" style="margin-top:24px;font-size:30px">{{handle}}</div>
</div>
