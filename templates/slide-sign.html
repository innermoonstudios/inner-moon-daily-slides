<div class="frame"></div>
<img class="moon" src="{{moon}}" style="position:absolute;width:var(--moon-corner);right:110px;top:118px">
<div id="content" style="left:120px;right:120px;top:130px">
  <div class="kicker">{{element}} · {{index}} of {{count}}</div>
  <div class="signrow"><span class="glyph">{{glyph}}</span><h1 class="signname" style="font-size:{{signsize}}px">{{sign}}</h1></div>
  <div class="dates">{{dates}}</div>
  <div class="rule">{{star}}</div>
  <p class="body">{{body}}</p>
  <div class="ask"><div class="kicker" style="font-size:22px">Ask yourself</div><p class="question">{{question}}</p></div>
</div>
