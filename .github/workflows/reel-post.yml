name: Reel post

# Posts reels/queue/<today>.json as an Instagram Reel at 18:00 America/New_York, on days that have one
# (planned cadence: Mon/Wed/Fri). Two cron times cover daylight saving (22:00 UTC = 6pm EDT,
# 23:00 UTC = 6pm EST); reel_today.py skips before 18:00 and never posts the same day twice.
# A queue file only posts if "status" is "approved"; set "hold" to skip a day.
# By hand: Actions > Reel post > Run workflow. Blank video = the queue file for `date` (blank = today);
# or name any MP4 under reels/. Leave publish unticked for a dry run (creates and checks the container).
on:
  schedule:
    - cron: "0 22 * * *"
    - cron: "0 23 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Queue date to post (YYYY-MM-DD). Blank = today in New York."
        required: false
      video:
        description: "Or post this MP4 instead of the queue (path under reels/)"
        required: false
      caption:
        description: "Caption for a video= run. Blank = the .txt next to the video, if any."
        required: false
      share_to_feed:
        description: "Also show the Reel in the profile grid? (video= runs; queue files set their own)"
        type: boolean
        default: true
      publish:
        description: "Publish to Instagram? (false = dry run, stops before posting)"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

# Shares the Pages group with the carousel workflows: each Pages deploy replaces the whole site,
# so runs queue instead of overwriting each other's files mid-run.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      post: ${{ steps.pick.outputs.post }}
      date: ${{ steps.pick.outputs.date }}
      caption: ${{ steps.pick.outputs.caption }}
      share_to_feed: ${{ steps.pick.outputs.share_to_feed }}
      queued: ${{ steps.pick.outputs.queued }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Each run gets its own folder so Instagram never fetches a cached old file.
      - id: pick
        env:
          POST_DATE: ${{ inputs.date }}
          VIDEO: ${{ inputs.video }}
          CAPTION: ${{ inputs.caption }}
          SHARE_TO_FEED: ${{ inputs.share_to_feed }}
        run: python scripts/reel_today.py "site/runs/${{ github.run_id }}"
      - if: steps.pick.outputs.post == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    if: needs.build.outputs.post == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  publish:
    needs: [build, deploy]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Wait until video is public
        run: |
          PAGE="${{ needs.deploy.outputs.page_url }}"
          URL="${PAGE%/}/runs/${{ github.run_id }}/reel.mp4"
          echo "VIDEO_URL=$URL" >> "$GITHUB_ENV"
          for i in $(seq 1 30); do
            if curl -sfI "$URL" | grep -qi "content-type: video/mp4"; then
              echo "Video live at $URL"; exit 0; fi
            sleep 10
          done
          echo "Video never became public"; exit 1
      - id: ig
        name: Create Reel container (and publish if chosen)
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          CAPTION: ${{ needs.build.outputs.caption }}
          SHARE_TO_FEED: ${{ needs.build.outputs.share_to_feed }}
          PUBLISH: ${{ github.event_name == 'schedule' || inputs.publish }}
        run: python scripts/publish_reel.py
      - name: Mark the day as published
        if: steps.ig.outputs.permalink != '' && needs.build.outputs.queued == 'true'
        run: |
          python scripts/mark_published.py "${{ needs.build.outputs.date }}" "${{ steps.ig.outputs.permalink }}" reels/queue
          git config user.name "inner-moon-bot"
          git config user.email "innermoonstudios@users.noreply.github.com"
          git add reels/queue && git commit -m "Published Reel ${{ needs.build.outputs.date }}"
          git pull --rebase && git push
